name: HW4 Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'hw4-ci-cd/app/**'
      - '.github/workflows/hw4-app.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'hw4-ci-cd/app/**'
      - '.github/workflows/hw4-app.yml'
      - 'hw4-ci-cd/k8s/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}
  KUSTOMIZE_VERSION: '5.8.3'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hw4-ci-cd/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: python -m pytest -v

  build:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./hw4-ci-cd/app
          file: ./hw4-ci-cd/app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=hw4-app
          cache-to: type=gha,mode=max,scope=hw4-app

  deploy:
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    concurrency:
      group: hw4-app-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_SA }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl get deployments
          kubectl get services

          kubectl auth can-i create deployments
          kubectl auth can-i patch deployments
          kubectl auth can-i delete deployments

          kubectl auth can-i create services
          kubectl auth can-i patch services

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v1
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Detect active version
        id: active-version
        run: |
          ACTIVE_VERSION=$(kubectl get service my-app \
            --ignore-not-found \
            -o jsonpath='{.spec.selector.version}')

          echo "Current active version: $ACTIVE_VERSION"
          echo "version=$ACTIVE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine next version
        id: next-version
        env:
          ACTIVE_VERSION: ${{ steps.active-version.outputs.version }}
        run: |
          if [[ -z "$ACTIVE_VERSION" ]]; then
            NEXT_MAJOR=1
          elif [[ "$ACTIVE_VERSION" =~ ^v([0-9]+)\.0\.0$ ]]; then
            CURRENT_MAJOR="${BASH_REMATCH[1]}"
            NEXT_MAJOR=$((CURRENT_MAJOR + 1))
          else
            echo "Unexpected active version: $ACTIVE_VERSION"
            exit 1
          fi

          echo "version=v${NEXT_MAJOR}.0.0" >> "$GITHUB_OUTPUT"
          echo "deployment=my-app-v${NEXT_MAJOR}" >> "$GITHUB_OUTPUT"
          echo "manifest=deployment-v${NEXT_MAJOR}.yaml" >> "$GITHUB_OUTPUT"
          echo "image=hello-gitops-v${NEXT_MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Initial deployment
        if: steps.active-version.outputs.version == ''
        working-directory: hw4-ci-cd/k8s
        run: |
          kustomize edit set image \
            "hello-gitops-v1=$IMAGE_NAME:$GITHUB_SHA"

          kustomize build .

          kubectl apply -k .

          kubectl rollout status deployment/my-app-v1 \
            --timeout=300s

          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: Generate next deployment
        if: steps.active-version.outputs.version != ''
        working-directory: hw4-ci-cd/k8s
        env:
          ACTIVE_VERSION: ${{ steps.active-version.outputs.version }}
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
          NEXT_DEPLOYMENT: ${{ steps.next-version.outputs.deployment }}
          NEXT_MANIFEST: ${{ steps.next-version.outputs.manifest }}
          NEXT_IMAGE: ${{ steps.next-version.outputs.image }}
        run: |
          CURRENT_MAJOR="${ACTIVE_VERSION%%.*}"
          CURRENT_MANIFEST="deployment-${CURRENT_MAJOR}.yaml"

          yq '
            .metadata.name = strenv(NEXT_DEPLOYMENT) |
            .spec.selector.matchLabels.version = strenv(NEXT_VERSION) |
            .spec.template.metadata.labels.version = strenv(NEXT_VERSION) |
            .spec.template.spec.containers[0].image = strenv(NEXT_IMAGE)
          ' "$CURRENT_MANIFEST" > "$NEXT_MANIFEST"

          cat "$NEXT_MANIFEST"

      - name: Prepare Kustomize configuration
        if: steps.active-version.outputs.version != ''
        working-directory: hw4-ci-cd/k8s
        env:
          NEXT_MANIFEST: ${{ steps.next-version.outputs.manifest }}
          NEXT_IMAGE: ${{ steps.next-version.outputs.image }}
        run: |
          kustomize edit add resource "$NEXT_MANIFEST"

          kustomize edit set image \
            "$NEXT_IMAGE=$IMAGE_NAME:$GITHUB_SHA"

          kustomize build .

      - name: Deploy candidate
        if: steps.active-version.outputs.version != ''
        working-directory: hw4-ci-cd/k8s
        shell: bash
        env:
          NEXT_DEPLOYMENT: ${{ steps.next-version.outputs.deployment }}
        run: |
          kustomize build . |
            yq -e 'select(
              .kind == "Deployment" and
              .metadata.name == strenv(NEXT_DEPLOYMENT)
            )' |
            kubectl apply -f -

      - name: Wait for candidate readiness
        if: steps.active-version.outputs.version != ''
        env:
          NEXT_DEPLOYMENT: ${{ steps.next-version.outputs.deployment }}
        run: |
          kubectl rollout status deployment/"$NEXT_DEPLOYMENT" \
            --timeout=300s

          kubectl get deployments
          kubectl get pods -L version
          
      - name: Switch traffic
        if: steps.active-version.outputs.version != ''
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          kubectl patch service my-app \
            -p "{\"spec\":{\"selector\":{\"version\":\"$NEXT_VERSION\"}}}"

          kubectl get service my-app \
            -o jsonpath='{.spec.selector}'

          echo

      - name: Update Kubernetes manifests
        if: steps.active-version.outputs.version != ''
        working-directory: hw4-ci-cd/k8s
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          yq -i '.spec.selector.version = strenv(NEXT_VERSION)' service.yaml

          kustomize build .

      - name: Commit and push Kubernetes manifests
        id: git-update
        env:
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          BRANCH_NAME="deploy/hw4-${NEXT_VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH_NAME"

          git add hw4-ci-cd/k8s/

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Deploy application ${NEXT_VERSION}"

          git push origin "$BRANCH_NAME"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create deployment pull request
        if: steps.git-update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.git-update.outputs.branch }}
          NEXT_VERSION: ${{ steps.next-version.outputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Deploy application ${NEXT_VERSION}" \
            --body "Update Kubernetes manifests after successful deployment of ${NEXT_VERSION}. Docker image tag: ${GITHUB_SHA}."
