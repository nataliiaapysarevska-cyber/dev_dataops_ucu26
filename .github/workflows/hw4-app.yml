name: HW4 Application CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'hw4-ci-cd/app/**'
      - '.github/workflows/hw4-app.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'hw4-ci-cd/app/**'
      - '.github/workflows/hw4-app.yml'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  IMAGE_NAME: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKER_REPOSITORY }}

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: hw4-ci-cd/app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: python -m pytest -v

  build:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./hw4-ci-cd/app
          file: ./hw4-ci-cd/app/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=hw4-app
          cache-to: type=gha,mode=max,scope=hw4-app